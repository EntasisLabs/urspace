name: Deploy www to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/www/**"
      - ".github/workflows/pages-www.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only one Pages deployment at a time; let an in-flight deploy finish rather
# than cancelling it half-way.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/www/package-lock.json
      - name: Install dependencies
        working-directory: apps/www
        run: npm ci
      - name: Build site
        working-directory: apps/www
        run: npm run build
      - name: Verify custom-domain CNAME landed in dist
        run: test "$(cat apps/www/dist/CNAME)" = "urspace.online"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/www/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
