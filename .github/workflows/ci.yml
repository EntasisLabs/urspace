name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - run: rustup default stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/cloudflare-worker/package-lock.json
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked
      - name: Install Worker dependencies
        working-directory: deploy/cloudflare-worker
        run: npm ci
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test --workspace
      - name: Test browser bootstrap
        working-directory: apps/bootstrap
        run: npm test
      - name: Test JavaScript client package
        working-directory: packages/client
        run: npm test
      - name: Build and check Cloudflare Worker
        working-directory: deploy/cloudflare-worker
        run: npm run check

  www:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/www/package-lock.json
      - name: Install marketing site dependencies
        working-directory: apps/www
        run: npm ci
      - name: Build marketing site
        working-directory: apps/www
        run: npm run build
