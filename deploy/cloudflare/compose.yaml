name: urspace-edge

services:
  bootstrap:
    image: urspace-bootstrap:local
    build:
      context: ../..
      dockerfile: deploy/bootstrap/Dockerfile
    command:
      - --base-domain
      - urspace.online
      - --listen
      - 0.0.0.0:8080
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

  cloudflared:
    image: cloudflare/cloudflared:2026.9.0@sha256:ff69a2225ad7c6f85ed84fbd5f3087df46202426b2388ec60214098e0adf05e9
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    depends_on:
      - bootstrap
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    secrets:
      - cloudflare_tunnel_token
    networks:
      - edge

networks:
  edge:
    driver: bridge

secrets:
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare-tunnel-token
